name: Weekly Charter Intervention Monitor

on:
  schedule:
    # 14:00 UTC every Monday = 9-10am Toronto time (varies with daylight saving).
    # Cron syntax: minute hour day-of-month month day-of-week
    - cron: "0 14 * * 1"
  # Lets you trigger a run manually from the Actions tab, to test without waiting for Monday.
  workflow_dispatch: {}

permissions:
  contents: write  # commit the updated database back to the repo
  pages: write     # publish the public site
  id-token: write  # required by the GitHub Pages deployment

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the monitor
        # Exits with an error if the health checks find a problem (a warning email is sent
        # too), so the run shows as failed. The database is still committed below.
        env:
          SCC_MONITOR_CONTACT: ${{ secrets.SCC_MONITOR_CONTACT }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASS: ${{ secrets.ALERT_SMTP_PASS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          # Optional: where health warnings go (defaults to ALERT_TO).
          HEALTH_TO: ${{ secrets.HEALTH_TO }}
          # Optional: Charter sections of special interest, e.g. "s. 7, s. 15".
          # Set under Settings > Secrets and variables > Actions > Variables.
          ALERT_SECTIONS: ${{ vars.ALERT_SECTIONS }}
          # "extra" (default): extra priority email for those sections, plus the usual one.
          # "only": email only those sections.
          ALERT_SECTIONS_MODE: ${{ vars.ALERT_SECTIONS_MODE }}
        run: python run_monitor.py

      - name: Commit updated database, if it changed
        if: always()
        run: |
          git config user.name "A2J Charter Monitor (bot)"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/monitor.sqlite; then
            git add data/monitor.sqlite
            git commit -m "Update monitor database [automated]"
            git push
          else
            echo "No changes to the database this run."
          fi

  publish-site:
    # Rebuilds the public page from the latest database, even if the health check failed.
    needs: run-monitor
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the latest commit (including the bot's database update)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: python build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
